name: Build and release

# Manual: build the four dictionaries, validate them and publish them as the latest GitHub release,
# so Yomitan's "Check for updates" picks them up. The revision in every index.json and the release
# tag are the same value: UTC date + run number unless one is given.
#
# Two jobs: "build" runs the dependencies and the build with a read-only token and hands the zips
# over as an artifact; only "publish", which runs nothing but gh, can write to the repository.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (off: build only, zips kept as a workflow artifact)"
        type: boolean
        default: true
      revision:
        description: "index.json revision, four dot-separated integers (default: UTC date + run number, e.g. 2026.11.15.7)"
        type: string
        default: ""

permissions: {}

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        # Naming the shell makes Actions run it as `bash -eo pipefail`.
        shell: bash
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - name: Releases are published from the default branch
        if: ${{ inputs.publish && github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "::error::run this workflow on ${{ github.event.repository.default_branch }}, or turn 'publish' off for a build-only run"
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Choose the revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, never pasted into the script text.
          INPUT_REVISION: ${{ inputs.revision }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          shape='^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'
          rev="$INPUT_REVISION"
          [ -n "$rev" ] || rev="$(date -u +%Y.%m.%d).$RUN_NUMBER"
          if ! [[ "$rev" =~ $shape ]]; then
            echo "::error::revision '$rev' must be four dot-separated integers, e.g. 2026.11.15.7"
            exit 1
          fi
          # a tag without a release counts too: gh would reuse it, whatever commit it is on
          if gh release view "v$rev" > /dev/null 2>&1 ||
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$rev" > /dev/null 2>&1; then
            echo "::error::v$rev already exists"
            exit 1
          fi
          # Yomitan only offers a revision that is greater than the installed one, so a release
          # must outrank the latest one, segment by segment.
          latest="$(gh release view --json tagName --jq .tagName 2> /dev/null || true)"
          latest="${latest#v}"
          if [[ "$latest" =~ $shape ]]; then
            IFS=. read -r -a new <<< "$rev"
            IFS=. read -r -a old <<< "$latest"
            newer=false
            for i in 0 1 2 3; do
              if ((10#${new[i]} > 10#${old[i]})); then newer=true; break; fi
              if ((10#${new[i]} < 10#${old[i]})); then break; fi
            done
            if [ "$newer" != true ]; then
              echo "::error::revision $rev is not greater than the latest release ($latest); nobody would be offered it as an update"
              exit 1
            fi
          fi
          echo "REVISION=$rev" >> "$GITHUB_ENV"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "revision $rev"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # export.ts reads REVISION and GITHUB_REPOSITORY from the environment.
        run: npm run build

      - name: Validate
        run: node scripts/validate.ts --revision "$REVISION"

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --json tagName,body > "$RUNNER_TEMP/previous.json" 2> /dev/null || echo '{}' > "$RUNNER_TEMP/previous.json"
          # The commits since the previous release, from the API: the checkout has no history.
          # Without the file the notes leave the commits out, which is what a failed request gets.
          previous_tag="$(gh release view --json tagName --jq .tagName 2> /dev/null || true)"
          if [ -n "$previous_tag" ]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$previous_tag...$GITHUB_SHA" \
              --jq '[.commits[] | {sha, message: .commit.message}]' > "$RUNNER_TEMP/commits.json" ||
              rm -f "$RUNNER_TEMP/commits.json"
          fi
          node scripts/release-notes.ts --previous "$RUNNER_TEMP/previous.json" --commits "$RUNNER_TEMP/commits.json"
          cat reports/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the zips
        uses: actions/upload-artifact@v7
        with:
          name: dictionaries-${{ env.REVISION }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/*.zip
            build/index-*.json
            reports/release-notes.md

  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      REVISION: ${{ needs.build.outputs.revision }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dictionaries-${{ needs.build.outputs.revision }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # --target: without it gh tags the branch head at publish time, which is not the built
        # commit when something was pushed during the build.
        run: |
          gh release create "v$REVISION" build/*.zip build/index-*.json \
            --target "$GITHUB_SHA" --title "v$REVISION" --latest \
            --notes-file reports/release-notes.md
