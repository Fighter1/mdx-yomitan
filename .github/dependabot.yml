version: 2

# Weekly. Minor and patch npm updates arrive as one pull request; each major gets its own, so a
# breaking one cannot hold the rest back. "Build and check" builds and validates the dictionaries
# on each of them.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Follows the Node version in .nvmrc; raise the two together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The parsers work on cheerio's nodes, so these two have to be the majors cheerio itself
      # depends on; raise them when cheerio does.
      - dependency-name: "domhandler"
        update-types: ["version-update:semver-major"]
      - dependency-name: "domelementtype"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
